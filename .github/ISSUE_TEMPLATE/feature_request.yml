name: 功能建议
description: 你想解决什么问题、希望怎么解决
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说场景与痛点，再说方案——这有助于我们评估替代路径
      placeholder: '当我在 … 场景下 …'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的形态
      description: 期望的交互/接口/行为；能画个草图或给个命令示例更好
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 影响面（可多选）
      options:
        - label: 引擎侧（loadn 包）
        - label: 平台侧（loadn_webui / 前端）
        - label: 文档 / 示例
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 你考虑过哪些替代做法、为什么不够好
    validations:
      required: false
  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意自己提 PR
      options:
        - 愿意（请在实现前先在本 issue 对齐方案）
        - 暂不，期望维护者实现
        - 讨论后再定
    validations:
      required: true
