name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # 周一 04:23 UTC（audit job）

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  models-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_models.py

  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'   # nightly 发布门（P3-2；红=阻断）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,webui]"
      - run: python evals/run.py --suite smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: evals/reports/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          LOADN_PROVIDER: fake

  coverage:
    # T1（tests/TEST-PLAN.md）：双包行覆盖率 + 门禁（基线 78.8%；
    # 每张 T 卡收口时收紧 fail-under——TEST-PLAN §六目标 85%）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[webui,dev]" pytest-cov
      - run: pytest -q --cov=loadn --cov=loadn_webui --cov-report=term
             --cov-fail-under=83
        env:
          LOADN_PROVIDER: fake

  ui:
    # 前端可构建（tsc + vite build），dist 不入库但随 release 发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  webui:
    # 平台全量（loadn_webui）：webui extras + 同 venv 引擎（契约对赌需要
    # loadn console_script）。legacy 资产依赖的测试自带 skipif。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[webui,dev]" pytest-cov
      - run: pip install playwright && playwright install chromium --with-deps || true
      - run: pytest -q --cov=loadn_webui --cov-fail-under=83
        env:
          LOADN_PROVIDER: fake

  audit:
    # 供应链：依赖漏洞周扫（pip-audit 对 extras 全量解析）
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -e ".[webui,dev]" --strict
