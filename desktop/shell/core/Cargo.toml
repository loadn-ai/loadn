[package]
name = "loadn-shell-core"
version = "0.1.0"
description = "桌面壳核心：VM 执行域生命周期（WSL2/VZ）+ 资产校验 + 回环 http —— 纯 std，三平台可本机 check/test"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
