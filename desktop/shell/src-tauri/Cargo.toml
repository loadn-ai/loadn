[package]
name = "loadn-desktop"
version = "0.1.0"
description = "loadn 桌面壳：VM 执行域生命周期（loadn-shell-core）+ Tauri/WebView 宿主"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loadn-shell-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
