<!doctype html>
<!-- loadn 登录页：nginx 直接 alias 服务（免认证），零应用代码依赖。
     凭证以 Basic 头发 /ld-grant，由 nginx 对共享 htpasswd 校验后种 wd_auth cookie（90 天）。
     纯静态 + 内联 CSS/JS，勿引入任何外部资源。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#101216" />
<title>loadn · 登录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #101216; --bg2: #171a21; --border: #2a2f3a;
    --text: #c9d1d9; --text-dim: #8b949e;
    --accent: #4f8cff; --fg-on-accent: #fff; --red: #f85149;
    color-scheme: dark;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --bg2: #ffffff; --border: #dde1e8;
      --text: #232a35; --text-dim: #6a7382;
      --accent: #3573e0; --fg-on-accent: #fff; --red: #d5443c;
      color-scheme: light;
    }
  }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; min-height: 100dvh;
    background: var(--bg); color: var(--text); font-size: 14px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .card {
    width: min(340px, 100%);
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px 24px calc(24px + env(safe-area-inset-bottom) / 2);
  }
  h1 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 20px; }
  input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 16px; /* 16px：防 iOS 聚焦缩放 */
    margin-bottom: 10px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); color: var(--fg-on-accent);
    border: none; border-radius: 8px; padding: 11px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  #msg { color: var(--red); min-height: 1.2em; font-size: 13px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <h1>loadn</h1>
  <p class="sub">登录一次，90 天内免登录（PWA 同样生效）</p>
  <form id="f">
    <input name="user" autocomplete="username" placeholder="用户名" autocapitalize="none" required />
    <input type="password" name="pass" autocomplete="current-password" placeholder="密码" required />
    <button id="b" type="submit">登录</button>
  </form>
  <p id="msg"></p>
</main>
<script>
'use strict';
(function () {
  var msg = document.getElementById('msg');
  var form = document.getElementById('f');
  var btn = document.getElementById('b');

  if (location.protocol !== 'https:') {
    // Secure cookie 在 http 下会被浏览器拒收，提前拦住并指路
    msg.textContent = '请改用 https://work.example.test:30443 访问';
    btn.disabled = true;
    return;
  }

  // 已登录探测：cookie 活着（PWA 重开）→ 零感知直达；未登录（opaqueredirect）→ 留在表单页
  fetch('/', { redirect: 'manual' })
    .then(function (r) { if (r.ok) location.replace('/'); })
    .catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    msg.textContent = '';
    // redirect:'manual'：server 级 error_page 会把 401 变 302，跟随后 r.ok 会假成功
    fetch('/ld-grant', {
      method: 'GET',
      headers: { 'Authorization': 'Basic ' + btoa(form.user.value + ':' + form.pass.value) },
      redirect: 'manual'
    }).then(function (r) {
      if (r.ok) { location.replace('/'); return; }  // replace：登录页不进历史栈
      msg.textContent = '用户名或密码错误';
    }).catch(function () {
      msg.textContent = '网络错误，请重试';
    }).finally(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
